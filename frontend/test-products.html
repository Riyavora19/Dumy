<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Products API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .product-card h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .product-card p {
            margin: 5px 0;
            color: #666;
        }
        .price {
            font-size: 18px;
            font-weight: bold;
            color: #1976d2;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Products API Test</h1>
    <div id="status"></div>
    <div id="products" class="product-grid"></div>

    <script>
        async function testProducts() {
            const statusDiv = document.getElementById('status');
            const productsDiv = document.getElementById('products');
            
            statusDiv.innerHTML = '<div class="loading">Loading products...</div>';
            
            try {
                const response = await fetch('http://localhost:5000/api/products');
                const data = await response.json();
                
                console.log('API Response:', data);
                
                const products = data.data || data.products || [];
                
                if (products.length === 0) {
                    statusDiv.innerHTML = '<div class="error">No products found! Run: node backend/addSampleProducts.js</div>';
                    return;
                }
                
                statusDiv.innerHTML = `<div class="success">✅ Found ${products.length} products!</div>`;
                
                productsDiv.innerHTML = products.slice(0, 20).map(product => `
                    <div class="product-card">
                        <h3>${product.name}</h3>
                        <p><strong>Variant:</strong> ${product.variant}</p>
                        <p><strong>Company:</strong> ${product.companyName || 'N/A'}</p>
                        <p><strong>SKU:</strong> ${product.sku || 'N/A'}</p>
                        <p class="price">₹${product.price?.toLocaleString()}</p>
                        <p><strong>Stock:</strong> ${product.stock}</p>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = `<div class="error">Error loading products: ${error.message}</div>`;
            }
        }
        
        testProducts();
    </script>
</body>
</html>
